# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: ci-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  issues: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          DB_SOURCE: postgresql://root:password@localhost:5432/catat?sslmode=disable
          SERVER_ADDRESS: 0.0.0.0:3000
          TOKEN_SYMMETRIC_KEY: 12345678901234567890123456789012
          ACCESS_TOKEN_DURATION: 72h
          GOOGLE_OAUTH_CLIENT_ID: test-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: test-client-secret
          GOOGLE_OAUTH_REDIRECT_URL: http://localhost:3000/users/google/callback
          FRONTEND_URL: http://localhost:5173
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.4"

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/
          which migrate

      - name: Run migration
        run: make migrateup

      - name: Test
        run: make test