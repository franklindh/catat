      email:
        type: string
      google_id:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  api.categoryResponse:
    properties:
      created_at:
        format: date-time
        type: string
      icon_url:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      updated_at:
        format: date-time
        type: string
      user_id:
        type: integer
    type: object
  api.createCategoryRequest:
    properties:
      icon_url:
        type: string
      name:
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        type: string
    required:
    - name
    type: object
  api.createTransactionRequest:
    properties:
      amount:
        type: string
      category_id:
        type: integer
      description:
        type: string
      transaction_date:
        type: string
      type:
        type: string
    required:
    - amount
    - transaction_date
    - type
    type: object
  api.dailyExpenseTrendResponse:
    properties:
      date:
        type: string
      total_amount:
        type: number
    type: object
  api.dashboardSummaryResponse:
    properties:
      total_expense:
        type: number
      total_income:
        type: number
    type: object
  api.expenseByCategoryResponse:
    properties:
      category_name:
        type: string
      icon_url:
        type: string
      total_amount:
        type: number
      transaction_count:
        type: integer
    type: object
  api.listUsersResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/api.adminUserResponse'
        type: array
    type: object
  api.totalBalanceResponse:
    properties:
      current_balance:
        type: number
    type: object
  api.transactionResponse:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      created_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: integer
      transaction_date:
        format: date-time
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  api.updateCategoryRequest:
    properties:
      icon_url:
        type: string
      name:
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        type: string
    required:
    - name
    type: object
  api.updateTransactionRequest:
    properties:
